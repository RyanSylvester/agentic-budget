name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: client
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build client
        run: bun run build
        working-directory: client
