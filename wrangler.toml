# Daybook on Cloudflare Workers. One Worker serves the JSON API and the Vite
# client as static assets, same-origin (no CORS). No secrets in this file:
# database_id and binding names are not secret. The production PEPPER secret
# is set with `wrangler secret put PEPPER` and never committed. Agent access
# uses per-user bearer tokens minted via POST /api/auth/agent-tokens; there
# is no global agent token. For local `wrangler dev`, dev-only values live in
# `.dev.vars` (gitignored).

name = "daybook"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# The Vite client build. Explicit routing: /api/* always runs the Worker;
# everything else is served as static assets, with unknown paths rewritten
# to /index.html so the SPA router handles client-side routes.
[assets]
directory = "./client/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# D1: the hosted SQLite database holding all budget data.
[[d1_databases]]
binding = "DB"
database_name = "daybook"
database_id = "23cf04d3-254c-4a02-88fb-caa430eaa202"
# Timestamped migrations live in src/migrations (applied to remote D1 by
# `budget migrate-remote`; applied to the local dev D1 by
# `wrangler d1 migrations apply daybook --local`).
migrations_dir = "src/migrations"

# KV: session tokens + login rate-limit keys (Phase 5 auth).
[[kv_namespaces]]
binding = "SESSIONS"
id = "e4b5e8c08e2f4ddbb78f45847ef3a0a2"
